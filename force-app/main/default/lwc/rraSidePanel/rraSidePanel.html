<template>
  <template if:true={isOpen}>
    <section
      class={panelClasses}
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="side-panel-heading"
    >
      <div class="slds-panel__header">
        <div class="slds-media slds-media_center">
          <template if:true={showStrongInfluencerIcon}>
            <div class="slds-media__figure">
              <span class="star-icon">
                <lightning-icon icon-name="utility:favorite" size="small"></lightning-icon>
              </span>
            </div>
          </template>
          <div class="slds-media__body">
            <h2 id="side-panel-heading" class="slds-panel__header-title slds-text-heading_medium">
              {panelTitle}
            </h2>
          </div>
        </div>
        <lightning-button-icon
          icon-name="utility:close"
          alternative-text="Close"
          variant="bare"
          onclick={handleClose}
          class="slds-panel__close"
        ></lightning-button-icon>
      </div>
      <div class="slds-panel__body">
        <template if:true={nodeData}>
          <div class="slds-m-bottom_small">
            <div class="slds-media slds-media_center slds-m-bottom_x-small">
              <div class="slds-media__figure">
                <span class="entity-avatar">
                  <lightning-icon icon-name={entityIcon} size="small"></lightning-icon>
                </span>
              </div>
              <div class="slds-media__body">
                <div class="slds-text-heading_medium slds-text-title_bold">{nodeData.label}</div>
                <div class="slds-text-body_small slds-text-color_weak">{entitySubtitle}</div>
              </div>
            </div>
            <hr class="slds-m-top_small" />
          </div>

          <template if:true={nodeData.context}>
            <div class="slds-m-bottom_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_small">{contextHeading}</h3>
              <div class="slds-text-body_regular">{nodeData.context}</div>
            </div>
          </template>

          <template if:true={hasCitation}>
            <div class="slds-m-bottom_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_small">Citation</h3>
              <div class="slds-text-body_small slds-text-color_weak">{nodeData.citation}</div>
              <template if:true={nodeData.citationURL}>
                <div class="slds-m-top_x-small">
                  <a
                    href={nodeData.citationURL}
                    target="_blank"
                    rel="noopener noreferrer"
                    class="slds-text-link"
                  >
                    [Source] {truncatedCitationURL}
                  </a>
                </div>
              </template>
            </div>
          </template>
        </template>
      </div>
      <div class="slds-panel__footer">
        <template if:true={hasRecordId}>
          <template if:true={needsConfirmation}>
            <lightning-button
              label="Match Record"
              variant="neutral"
              onclick={handleConfirmMatch}
            ></lightning-button>
          </template>
          <template if:false={needsConfirmation}>
            <lightning-button
              label="View Record"
              variant="neutral"
              onclick={handleViewRecord}
            ></lightning-button>
          </template>
        </template>
        <template if:false={hasRecordId}>
          <lightning-button
            label="Create Record"
            variant="neutral"
            onclick={handleCreateRecord}
          ></lightning-button>
        </template>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick}></div>
  </template>
</template>
